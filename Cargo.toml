[package]
name = "keyphore"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.0", features = ["derive", "env"] }
hidapi = { version = "2.6.5", default-features = false, features = ["linux-static-hidraw"] }
fs2 = "0.4.3"
libc = "0.2.183"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

[dev-dependencies]
assert_cmd = "2.1.1"
predicates = "3.1.4"
tempfile = "3.27.0"
