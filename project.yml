name: Keyphore
options:
  minimumXcodeGenVersion: 2.45.0
packages:
  KeyphoreAppModules:
    path: app
targets:
  KeyphoreRuntime:
    type: tool
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: runtime/Sources
    dependencies:
      - package: KeyphoreAppModules
        product: KeyphoreCore
    settings:
      base:
        ARCHS: arm64
        PRODUCT_NAME: keyphore
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_VERSION: 6.0
  Keyphore:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    info:
      path: app/Resources/Info.plist
      properties:
        CFBundleDevelopmentRegion: en
        CFBundleDisplayName: Keyphore
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations:
          - en
          - zh-Hans
        LSApplicationCategoryType: public.app-category.utilities
        LSUIElement: true
    sources:
      - path: app/Sources/KeyphoreApp
      - path: app/Resources/Assets.xcassets
    dependencies:
      - target: KeyphoreRuntime
      - package: KeyphoreAppModules
        product: KeyphoreCore
    postBuildScripts:
      - name: Embed Keyphore Runtime
        script: |
          set -eu
          helper_dir="$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers"
          /bin/mkdir -p "$helper_dir"
          /usr/bin/install -m 755 "$BUILT_PRODUCTS_DIR/keyphore" "$helper_dir/keyphore"
        inputFiles:
          - $(BUILT_PRODUCTS_DIR)/keyphore
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Helpers/keyphore
    settings:
      base:
        ARCHS: arm64
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 1
        ENABLE_HARDENED_RUNTIME: true
        MARKETING_VERSION: 0.1.0
        PRODUCT_BUNDLE_IDENTIFIER: com.barrywu.keyphore
        PRODUCT_NAME: Keyphore
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_VERSION: 6.0
  KeyphoreAppTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: app/Tests/KeyphoreAppTests
      - path: app/Sources/KeyphoreApp/AggregateSignal+Presentation.swift
      - path: app/Sources/KeyphoreApp/SignalColor+SwiftUI.swift
    dependencies:
      - package: KeyphoreAppModules
        product: KeyphoreCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_VERSION: 6.0
schemes:
  Keyphore:
    build:
      targets:
        Keyphore: all
        KeyphoreAppTests: [test]
    test:
      targets:
        - KeyphoreAppTests
    run:
      config: Debug
