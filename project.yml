name: Keyphore
options:
  minimumXcodeGenVersion: 2.45.0
packages:
  KeyphoreAppModules:
    path: app
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.9.6
targets:
  KeyphoreRuntime:
    type: tool
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: runtime/Sources
    dependencies:
      - package: KeyphoreAppModules
        product: KeyphoreCore
    settings:
      base:
        ARCHS: arm64
        PRODUCT_NAME: keyphore
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_VERSION: 6.0
  KeyphoreCompanion:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    info:
      path: runtime/Resources/Companion-Info.plist
      properties:
        CFBundleDevelopmentRegion: en
        CFBundleDisplayName: Keyphore
        CFBundleIconFile: AppIcon
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
    sources:
      - path: runtime/Sources
      - path: app/Resources/Assets.xcassets
    dependencies:
      - package: KeyphoreAppModules
        product: KeyphoreCore
    settings:
      base:
        ARCHS: arm64
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 1
        ENABLE_HARDENED_RUNTIME: true
        MARKETING_VERSION: 0.1.0
        PRODUCT_BUNDLE_IDENTIFIER: com.barrywu.keyphore.companion
        PRODUCT_NAME: Keyphore Companion
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_VERSION: 6.0
  Keyphore:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    info:
      path: app/Resources/Info.plist
      properties:
        CFBundleDevelopmentRegion: en
        CFBundleDisplayName: Keyphore
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations:
          - en
          - zh-Hans
        LSApplicationCategoryType: public.app-category.utilities
        LSUIElement: true
        SUAllowsAutomaticUpdates: false
        SUAutomaticallyUpdate: false
        SUEnableAutomaticChecks: true
        SUFeedURL: $(KEYPHORE_UPDATE_FEED_URL)
        SUPublicEDKey: $(KEYPHORE_UPDATE_PUBLIC_ED_KEY)
        SURequireSignedFeed: true
    sources:
      - path: app/Sources/KeyphoreApp
      - path: app/Resources/Assets.xcassets
    dependencies:
      - target: KeyphoreRuntime
      - target: KeyphoreCompanion
        copy: false
        embed: false
        link: false
      - package: KeyphoreAppModules
        product: KeyphoreCore
      - package: Sparkle
        product: Sparkle
    postBuildScripts:
      - name: Embed Keyphore Runtime
        script: |
          set -eu
          helper_dir="$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers"
          /bin/mkdir -p "$helper_dir"
          /usr/bin/install -m 755 "$BUILT_PRODUCTS_DIR/keyphore" "$helper_dir/keyphore"
          companion_dir="$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Library/LoginItems"
          companion_app="$companion_dir/Keyphore Companion.app"
          /bin/mkdir -p "$companion_dir"
          if [[ -e "$companion_app" ]]; then
            /usr/bin/find "$companion_app" -depth -delete
          fi
          /usr/bin/ditto "$BUILT_PRODUCTS_DIR/Keyphore Companion.app" "$companion_app"
        inputFiles:
          - $(BUILT_PRODUCTS_DIR)/keyphore
          - $(BUILT_PRODUCTS_DIR)/Keyphore Companion.app
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Helpers/keyphore
          - $(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Library/LoginItems/Keyphore Companion.app/Contents/Info.plist
    settings:
      base:
        ARCHS: arm64
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 1
        ENABLE_HARDENED_RUNTIME: true
        MARKETING_VERSION: 0.1.0
        PRODUCT_BUNDLE_IDENTIFIER: com.barrywu.keyphore
        PRODUCT_NAME: Keyphore
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_VERSION: 6.0
  KeyphoreAppTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: app/Tests/KeyphoreAppTests
      - path: app/Sources/KeyphoreApp/AggregateSignal+Presentation.swift
      - path: app/Sources/KeyphoreApp/KeyphoreAppDelegate.swift
      - path: app/Sources/KeyphoreApp/KeyphoreAppState.swift
      - path: app/Sources/KeyphoreApp/ManagedUpdateController.swift
      - path: app/Sources/KeyphoreApp/SignalColor+SwiftUI.swift
      - path: app/Sources/KeyphoreApp/SystemGuidedSetup.swift
      - path: app/Sources/KeyphoreApp/ForegroundWindowAction.swift
    dependencies:
      - package: KeyphoreAppModules
        product: KeyphoreCore
      - package: Sparkle
        product: Sparkle
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_VERSION: 6.0
schemes:
  Keyphore:
    build:
      targets:
        Keyphore: all
        KeyphoreAppTests: [test]
    test:
      targets:
        - KeyphoreAppTests
    run:
      config: Debug
